[package]
name = "vinyldns-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Model Context Protocol (MCP) server for the VinylDNS DNS management API"
license = "Apache-2.0"
readme = "README.md"
keywords = ["mcp", "dns", "vinyldns", "model-context-protocol"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "vinyldns_mcp"
path = "src/lib.rs"

[[bin]]
name = "vinyldns-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hex = "0.4.3"
hmac = "0.13.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "system-proxy"] }
rmcp = { version = "3.5.0", features = ["server", "transport-io", "macros", "schemars", "elicitation"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-std", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "3.5.0", features = ["client", "transport-async-rw"] }
tokio = { version = "1.53.2", features = ["test-util"] }
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
