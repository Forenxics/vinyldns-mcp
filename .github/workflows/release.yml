name: Release

# Builds prebuilt binaries and publishes them to a GitHub release.
#
# Triggers:
#   - pushing a tag vX.Y.Z (or vX.Y.Z-rc.N, published as a pre-release)
#   - manually: Actions → Release → Run workflow, with a tag name. An existing
#     tag is rebuilt; a new tag is created on the commit the workflow runs
#     from (only from the default branch), after every build has passed.
#
# The tag must match `version` in Cargo.toml, and CHANGELOG.md must have a
# section for it; its text becomes the release notes. See docs/RELEASING.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.0. If it does not exist yet, it is created on this branch's latest commit (default branch only) once all builds pass."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      sha: ${{ steps.resolve.outputs.sha }}
      create_tag: ${{ steps.resolve.outputs.create_tag }}
    steps:
      - id: resolve
        name: Resolve the commit to release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if ref_json="$(gh api "repos/$REPO/git/ref/tags/$TAG" 2>/dev/null)"; then
            type="$(jq -r .object.type <<<"$ref_json")"
            sha="$(jq -r .object.sha <<<"$ref_json")"
            if [ "$type" = "tag" ]; then  # annotated tag: follow it to the commit
              sha="$(gh api "repos/$REPO/git/tags/$sha" --jq .object.sha)"
            fi
            create_tag=false
            echo "Tag $TAG exists at $sha"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            sha="$RUN_SHA"
            create_tag=true
            echo "Tag $TAG does not exist; it will be created at $sha ($DEFAULT_BRANCH) after a successful build"
          else
            echo "::error::Tag $TAG does not exist. New tags can only be created by running this workflow from $DEFAULT_BRANCH."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.sha }}
      - id: check
        name: Tag matches Cargo.toml and CHANGELOG.md
        run: |
          version="${TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          python3 scripts/changelog_section.py "$TAG" > /dev/null
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fully static Linux binary: runs on any x86_64 distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            apt: musl-tools
            runnable: true
          # Cross-compiled on x86_64; needs glibc 2.35+ (Ubuntu 22.04, Debian 12, RHEL 10).
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            apt: gcc-aarch64-linux-gnu
            runnable: false
          - target: aarch64-apple-darwin
            os: macos-latest
            runnable: true
          - target: x86_64-apple-darwin
            os: macos-latest
            runnable: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
            runnable: true
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross toolchain
        if: matrix.apt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.apt }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary runs
        if: matrix.runnable
        shell: bash
        run: |
          out="$(target/${{ matrix.target }}/release/vinyldns-mcp${{ matrix.exe }} --version)"
          echo "$out"
          [ "$out" = "vinyldns-mcp ${TAG#v}" ]
      - name: Package
        id: package
        shell: bash
        run: |
          name="vinyldns-mcp-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/vinyldns-mcp${{ matrix.exe }}" README.md LICENSE CHANGELOG.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip -bso0 "$name.zip" "$name"
            echo "archive=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum vinyldns-mcp-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Build provenance attestations are free for public repositories; private
      # repositories need GitHub Enterprise Cloud, so this is skipped there.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/vinyldns-mcp-*
      - name: Release notes
        run: |
          python3 scripts/changelog_section.py "$TAG" > notes.md
          cat >> notes.md <<'EOF'

          ---
          **Install:** download the archive for your platform, extract it, and put `vinyldns-mcp` on your `PATH`.
          Verify the download with `sha256sum -c SHA256SUMS.txt --ignore-missing`.
          See the README for client configuration.
          EOF
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          CREATE_TAG: ${{ needs.prepare.outputs.create_tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists; uploading assets."
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            if [ "$CREATE_TAG" = "true" ]; then
              flags+=(--target "$SHA")  # gh creates the tag on this commit
            else
              flags+=(--verify-tag)
            fi
            gh release create "$TAG" dist/* --title "vinyldns-mcp $TAG" --notes-file notes.md "${flags[@]}"
          fi
